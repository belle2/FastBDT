name: CI (macOS)

on:
  push:

jobs:
  build-and-test:
    name: Build and test on macOS
    runs-on: macos-latest
    env:
      CC: clang
      CXX: clang++
      CMAKE_USE_DOUBLE_WEIGHT: "OFF"

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake googletest

      - name: Set up Python venv
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install setuptools wheel

      - name: Configure, build and install
        # The venv must be active so CMake picks up the venv Python
        # interpreter for the install-time pip step
        run: |
          source venv/bin/activate
          cmake -S . -B build \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
            -DUSE_DOUBLE_WEIGHT=${{ env.CMAKE_USE_DOUBLE_WEIGHT }} \
            -DCMAKE_PREFIX_PATH=$(brew --prefix) \
            -DPYTHON=$(which python3)
          cmake --build build -j $(sysctl -n hw.ncpu)
          cmake --install build

      - name: Verify Python bindings
        # Run from /tmp so Python cannot accidentally import the package
        # from the source tree
        run: |
          source venv/bin/activate
          cd /tmp
          python3 -c "import PyFastBDT; print('PyFastBDT version:', PyFastBDT.__version__)"
          python3 -c "import PyFastBDT.FastBDT as FastBDT; print('PyFastBDT uses float for weights:', FastBDT._is_weight_float)"

      - name: Run C++ unit tests
        run: |
          export DYLD_LIBRARY_PATH=${{ github.workspace }}/install/lib:$(brew --prefix)/lib
          ${{ github.workspace }}/install/bin/fastbdt-unittests

      - name: Run Python unit tests
        run: |
          source venv/bin/activate
          python3 -m pytest tests/test_python_interface.py

      - name: Run C++ example
        run: |
          cd examples
          ${CXX} IRISExample.cxx -o IRISExample -O3 \
            -l FastBDT_static \
            -L ${{ github.workspace }}/install/lib \
            -I ${{ github.workspace }}/install/include
          ./IRISExample iris.csv

      - name: Run Python examples
        run: |
          source venv/bin/activate
          cd examples
          python3 iris_example.py iris.csv
          python3 generic_example.py
